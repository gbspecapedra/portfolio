name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check source
        run: |
          npm run lint
          npm run typecheck
          npm run test:lint
      - run: npm run build
        env:
          FORMSPREE_FORM_ID: portfoliofixture
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failures
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
